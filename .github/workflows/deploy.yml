name: Deploy

# Solo manual hasta el Sprint 3: aún no existe el servidor Coolify ni los secretos
# COOLIFY_WEBHOOK_URL / COOLIFY_API_TOKEN. Al montarlo, restaurar:
#   push:
#     branches: [main]
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
